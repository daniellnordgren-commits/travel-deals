<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mina Resedeals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#8FE0F7;
    --sky-mid:#4FC3E8;
    --sky-deep:#1F8FC4;
    --aqua:#0FA8A0;
    --sun:#FFC93C;
    --sun-deep:#FFA53C;
    --coral:#FF7F5C;
    --ink:#0B3B57;
    --ink-soft:#3D6B85;
    --glass:rgba(255,255,255,0.60);
    --glass-strong:rgba(255,255,255,0.85);
    --card-shadow:0 18px 40px -14px rgba(15,90,120,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    font-family:'Nunito Sans',sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 600px at 15% -10%, #E9FBFF 0%, transparent 60%),
      linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 38%, #EAF7FB 75%, #F7FCFD 100%);
    overflow-x:hidden;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important;}
  }

  /* ---------- HERO ---------- */
  .hero{
    position:relative;
    padding:64px 24px 92px;
    text-align:center;
    overflow:hidden;
  }
  .bubble{
    position:absolute;
    border-radius:50%;
    background:radial-gradient(circle at 32% 28%, rgba(255,255,255,0.95), rgba(255,255,255,0.15) 55%, rgba(255,255,255,0.02) 70%);
    filter:blur(0.3px);
    animation:drift 18s ease-in-out infinite;
    pointer-events:none;
  }
  .bubble.b1{width:120px;height:120px; top:6%; left:8%; animation-duration:22s;}
  .bubble.b2{width:70px;height:70px; top:18%; left:82%; animation-duration:16s; animation-delay:-3s;}
  .bubble.b3{width:44px;height:44px; top:60%; left:4%; animation-duration:14s; animation-delay:-6s;}
  .bubble.b4{width:160px;height:160px; top:40%; left:70%; animation-duration:26s; animation-delay:-10s; opacity:0.6;}
  .bubble.b5{width:30px;height:30px; top:12%; left:48%; animation-duration:12s; animation-delay:-2s;}
  @keyframes drift{
    0%,100%{ transform:translateY(0) translateX(0); }
    50%{ transform:translateY(-22px) translateX(10px); }
  }

  .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-family:'JetBrains Mono',monospace;
    font-size:11.5px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--sky-deep);
    background:var(--glass);
    border:1px solid rgba(255,255,255,0.8);
    padding:7px 16px;
    border-radius:999px;
    backdrop-filter:blur(6px);
    box-shadow:0 6px 18px -8px rgba(15,90,120,0.25);
    margin-bottom:22px;
  }
  .eyebrow .live-dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--coral);
    box-shadow:0 0 0 4px rgba(255,127,92,0.25);
  }

  h1{
    font-family:'Baloo 2',sans-serif;
    font-weight:800;
    font-size:clamp(34px, 6vw, 58px);
    line-height:1.05;
    margin:0 0 14px;
    color:var(--ink);
    text-shadow:0 2px 0 rgba(255,255,255,0.5);
  }
  h1 .wave{ display:inline-block; }

  .subtitle{
    font-size:15.5px;
    color:var(--ink-soft);
    max-width:440px;
    margin:0 auto;
    line-height:1.55;
    font-weight:600;
  }

  /* ---------- GRID ---------- */
  .content{
    position:relative;
    max-width:1180px;
    margin:-56px auto 0;
    padding:0 20px 80px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(240px, 1fr));
    gap:26px;
  }

  .card{
    position:relative;
    background:var(--glass-strong);
    border-radius:26px;
    overflow:hidden;
    box-shadow:var(--card-shadow);
    border:1px solid rgba(255,255,255,0.9);
    backdrop-filter:blur(10px);
    transition:transform .25s ease, box-shadow .25s ease;
    display:flex;
    flex-direction:column;
    text-decoration:none;
    color:inherit;
    cursor:pointer;
  }
  .card:hover{
    transform:translateY(-6px);
    box-shadow:0 26px 50px -14px rgba(15,90,120,0.42);
  }

  .card-media{
    position:relative;
    aspect-ratio:4/5;
    background:linear-gradient(160deg, var(--sky-mid), var(--aqua));
    overflow:hidden;
  }
  .card-media img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }
  .card-media .sheen{
    position:absolute;
    inset:0;
    background:linear-gradient(115deg, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0.12) 22%, rgba(255,255,255,0) 40%);
    pointer-events:none;
  }
  .card-media .placeholder{
    width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    font-size:40px;
  }

  .price-pill{
    position:absolute;
    left:14px;
    bottom:14px;
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:15px;
    color:#5A3600;
    background:linear-gradient(180deg, #FFE28A 0%, var(--sun) 55%, var(--sun-deep) 100%);
    padding:8px 16px;
    border-radius:999px;
    box-shadow:0 8px 18px -6px rgba(255,165,60,0.6), inset 0 1px 0 rgba(255,255,255,0.8);
    border:1px solid rgba(255,255,255,0.6);
  }
  .price-pill .per{
    font-family:'Nunito Sans',sans-serif;
    font-weight:700;
    font-size:10.5px;
    opacity:0.75;
    margin-left:3px;
  }

  .card-body{
    padding:16px 18px 20px;
  }
  .card-body h3{
    font-family:'Baloo 2',sans-serif;
    font-size:19px;
    font-weight:700;
    margin:0 0 6px;
    color:var(--ink);
  }
  .card-meta{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:.02em;
    color:var(--ink-soft);
  }
  .card-meta .dot{ color:var(--aqua); }

  .card-property{
    margin-top:8px;
    font-size:12.5px;
    color:var(--ink-soft);
    font-weight:600;
    opacity:0.85;
  }

  /* ---------- EMPTY / ERROR STATE ---------- */
  .empty{
    text-align:center;
    padding:70px 24px;
    background:var(--glass);
    border-radius:26px;
    border:1px solid rgba(255,255,255,0.8);
  }
  .empty .icon{ font-size:44px; margin-bottom:14px; }
  .empty h2{
    font-family:'Baloo 2',sans-serif;
    font-size:22px;
    margin:0 0 8px;
  }
  .empty p{
    color:var(--ink-soft);
    font-size:14px;
    max-width:340px;
    margin:0 auto;
    font-weight:600;
  }

  footer{
    text-align:center;
    padding:30px 20px 50px;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--ink-soft);
    opacity:0.7;
  }

  /* ---------- RESEDETALJER (MODAL) ---------- */
  body.modal-open .hero,
  body.modal-open .content,
  body.modal-open footer{
    display:none;
  }

  .modal-overlay{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(233,251,255,0.5) 0%, transparent 60%),
      linear-gradient(180deg, rgba(15,90,120,0.55) 0%, rgba(11,59,87,0.72) 100%);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    overflow-y:auto;
  }
  .modal-overlay[hidden]{ display:none; }

  .modal-panel{
    position:relative;
    width:100%;
    max-width:520px;
    max-height:calc(100vh - 48px);
    overflow-y:auto;
    background:var(--glass-strong);
    border:1px solid rgba(255,255,255,0.9);
    border-radius:28px;
    box-shadow:0 30px 70px -20px rgba(5,40,60,0.55);
    backdrop-filter:blur(14px);
    animation:modalPop .25s ease;
  }
  @keyframes modalPop{
    from{ opacity:0; transform:translateY(14px) scale(0.98); }
    to{ opacity:1; transform:translateY(0) scale(1); }
  }

  .modal-close{
    position:absolute;
    top:14px;
    right:14px;
    z-index:2;
    width:38px;
    height:38px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,0.7);
    background:rgba(11,59,87,0.55);
    color:#fff;
    font-size:17px;
    line-height:1;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    backdrop-filter:blur(4px);
  }
  .modal-close:hover{ background:rgba(11,59,87,0.8); }

  .modal-media{
    position:relative;
    aspect-ratio:4/3;
    background:linear-gradient(160deg, var(--sky-mid), var(--aqua));
    border-radius:28px 28px 0 0;
    overflow:hidden;
  }
  .modal-media img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }
  .modal-media .placeholder{
    width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    font-size:60px;
  }

  .modal-body{
    padding:22px 26px 30px;
  }
  .modal-title{
    font-family:'Baloo 2',sans-serif;
    font-weight:800;
    font-size:26px;
    margin:0 0 6px;
    color:var(--ink);
  }
  .modal-property{
    font-size:14px;
    font-weight:700;
    color:var(--ink-soft);
    margin-bottom:12px;
  }
  .modal-meta{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:'JetBrains Mono',monospace;
    font-size:12.5px;
    color:var(--ink-soft);
    margin-bottom:16px;
  }
  .modal-meta .dot{ color:var(--aqua); }

  .modal-price{
    display:inline-flex;
    align-items:baseline;
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:19px;
    color:#5A3600;
    background:linear-gradient(180deg, #FFE28A 0%, var(--sun) 55%, var(--sun-deep) 100%);
    padding:9px 18px;
    border-radius:999px;
    box-shadow:0 8px 18px -6px rgba(255,165,60,0.6), inset 0 1px 0 rgba(255,255,255,0.8);
    border:1px solid rgba(255,255,255,0.6);
    margin-bottom:20px;
  }
  .modal-price .per{
    font-family:'Nunito Sans',sans-serif;
    font-weight:700;
    font-size:11.5px;
    opacity:0.75;
    margin-left:4px;
  }

  .modal-links{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
  }
  .modal-link{
    flex:1 1 160px;
    text-align:center;
    text-decoration:none;
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:15px;
    padding:13px 16px;
    border-radius:16px;
    color:#fff;
    box-shadow:0 10px 22px -8px rgba(15,90,120,0.45);
    transition:transform .15s ease, filter .15s ease;
  }
  .modal-link:hover{ transform:translateY(-2px); filter:brightness(1.06); }
  .modal-link.flight{ background:linear-gradient(160deg, var(--sky-mid), var(--sky-deep)); }
  .modal-link.hotel{ background:linear-gradient(160deg, var(--coral), #E85B3E); }
  .modal-link:not(.flight):not(.hotel){ background:linear-gradient(160deg, var(--aqua), var(--sky-deep)); }

  .modal-no-link{
    font-size:13px;
    color:var(--ink-soft);
    font-weight:600;
    opacity:0.8;
  }
</style>
</head>
<body>

<div class="hero">
  <div class="bubble b1"></div>
  <div class="bubble b2"></div>
  <div class="bubble b3"></div>
  <div class="bubble b4"></div>
  <div class="bubble b5"></div>

  <span class="eyebrow"><span class="live-dot"></span> uppdateras live</span>
  <h1>Mina Resedeals <span class="wave">✈️🌊</span></h1>
  <p class="subtitle">Resor jag hittat till bra pris — spara länken innan de är borta.</p>
</div>

<div class="content">
  <div class="grid" id="grid"></div>
  <div class="empty" id="emptyState" style="display:none;">
    <div class="icon">🏖️</div>
    <h2>Inga resor än</h2>
    <p>Publicera en resa från Carousel Studio (knappen "Lägg till i Shop My Feed") så dyker den upp här automatiskt.</p>
  </div>
</div>

<footer>// resedeals · uppdateras automatiskt via Carousel Studio</footer>

<div class="modal-overlay" id="modalOverlay" hidden>
  <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button class="modal-close" id="modalClose" aria-label="Stäng">✕</button>
    <div class="modal-media" id="modalMedia"></div>
    <div class="modal-body">
      <h2 class="modal-title" id="modalTitle"></h2>
      <div class="modal-property" id="modalProperty"></div>
      <div class="modal-meta" id="modalMeta"></div>
      <div class="modal-price" id="modalPrice"></div>
      <div class="modal-links" id="modalLinks"></div>
    </div>
  </div>
</div>

<script>
  const grid = document.getElementById('grid');
  const emptyState = document.getElementById('emptyState');

  function fmtSEK(n){
    if (typeof n !== 'number') return '—';
    return Math.round(n).toLocaleString('sv-SE') + ' kr';
  }

  function fmtDateRange(checkin, checkout){
    if (!checkin) return null;
    const opts = { day:'numeric', month:'short' };
    const start = new Date(checkin);
    const startStr = start.toLocaleDateString('sv-SE', opts);
    if (!checkout) return startStr;
    const end = new Date(checkout);
    const endStr = end.toLocaleDateString('sv-SE', opts);
    const nights = Math.round((end - start) / 86400000);
    const nightsStr = nights > 0 ? `${nights} ${nights === 1 ? 'natt' : 'nätter'}` : null;
    return nightsStr ? `${startStr}–${endStr} · ${nightsStr}` : `${startStr}–${endStr}`;
  }

  function cardHTML(trip){
    const mediaInner = trip.imageUrl
      ? `<img src="${trip.imageUrl}" alt="${escapeHTML(trip.destination || '')}" loading="lazy"><div class="sheen"></div>`
      : `<div class="placeholder">🌅</div>`;

    const dateLine = fmtDateRange(trip.checkin, trip.checkout);

    return `
      <div class="card" data-id="${escapeHTML(trip.id || '')}" tabindex="0" role="button" aria-label="Visa resa: ${escapeHTML(trip.destination || 'okänd destination')}">
        <div class="card-media">
          ${mediaInner}
          <div class="price-pill">${fmtSEK(trip.priceSEK)}<span class="per">/pers</span></div>
        </div>
        <div class="card-body">
          <h3>${escapeHTML(trip.destination || 'Okänd destination')}</h3>
          ${dateLine ? `<div class="card-meta"><span class="dot">●</span> ${dateLine}</div>` : ''}
          ${trip.propertyName ? `<div class="card-property">${escapeHTML(trip.propertyName)}</div>` : ''}
        </div>
      </div>
    `;
  }

  function escapeHTML(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  let currentTrips = [];

  async function loadTrips(){
    try {
      const res = await fetch(`trips.json?t=${Date.now()}`, { cache: 'no-store' });
      if (!res.ok) throw new Error('Kunde inte hämta trips.json');
      const trips = await res.json();

      if (!Array.isArray(trips) || trips.length === 0) {
        emptyState.style.display = 'block';
        return;
      }

      currentTrips = [...trips].sort((a, b) => new Date(b.addedAt || 0) - new Date(a.addedAt || 0));
      grid.innerHTML = currentTrips.map(cardHTML).join('');
    } catch (e) {
      console.error(e);
      emptyState.style.display = 'block';
      emptyState.querySelector('h2').textContent = 'Kunde inte ladda resor';
      emptyState.querySelector('p').textContent = 'Något gick fel när trips.json skulle hämtas. Kontrollera att filen finns i repot.';
    }
  }

  /* ---------- RESEDETALJER (MODAL) ---------- */
  const modalOverlay = document.getElementById('modalOverlay');
  const modalClose = document.getElementById('modalClose');
  const modalMedia = document.getElementById('modalMedia');
  const modalTitle = document.getElementById('modalTitle');
  const modalProperty = document.getElementById('modalProperty');
  const modalMeta = document.getElementById('modalMeta');
  const modalPrice = document.getElementById('modalPrice');
  const modalLinks = document.getElementById('modalLinks');

  function openModal(trip){
    modalMedia.innerHTML = trip.imageUrl
      ? `<img src="${trip.imageUrl}" alt="${escapeHTML(trip.destination || '')}">`
      : `<div class="placeholder">🌅</div>`;

    modalTitle.textContent = trip.destination || 'Okänd destination';
    modalProperty.textContent = trip.propertyName || '';
    modalProperty.style.display = trip.propertyName ? 'block' : 'none';

    const dateLine = fmtDateRange(trip.checkin, trip.checkout);
    modalMeta.innerHTML = dateLine ? `<span class="dot">●</span> ${dateLine}` : '';
    modalMeta.style.display = dateLine ? 'flex' : 'none';

    modalPrice.innerHTML = `${fmtSEK(trip.priceSEK)}<span class="per">/pers</span>`;

    let linksHTML = '';
    if (trip.flightUrl) linksHTML += `<a class="modal-link flight" href="${escapeHTML(trip.flightUrl)}" target="_blank" rel="noopener noreferrer">✈️ Boka flyg</a>`;
    if (trip.hotelUrl) linksHTML += `<a class="modal-link hotel" href="${escapeHTML(trip.hotelUrl)}" target="_blank" rel="noopener noreferrer">🏨 Boka boende</a>`;
    if (!trip.flightUrl && !trip.hotelUrl && trip.bookingUrl) {
      linksHTML += `<a class="modal-link" href="${escapeHTML(trip.bookingUrl)}" target="_blank" rel="noopener noreferrer">🔗 Boka resa</a>`;
    }
    modalLinks.innerHTML = linksHTML || `<div class="modal-no-link">Ingen bokningslänk sparad än.</div>`;

    document.body.classList.add('modal-open');
    modalOverlay.hidden = false;
    modalOverlay.scrollTop = 0;
    modalClose.focus();
  }

  function closeModal(){
    document.body.classList.remove('modal-open');
    modalOverlay.hidden = true;
  }

  grid.addEventListener('click', (e) => {
    const card = e.target.closest('.card');
    if (!card) return;
    const trip = currentTrips.find(t => t.id === card.dataset.id);
    if (trip) openModal(trip);
  });

  grid.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const card = e.target.closest('.card');
    if (!card) return;
    e.preventDefault();
    const trip = currentTrips.find(t => t.id === card.dataset.id);
    if (trip) openModal(trip);
  });

  modalClose.addEventListener('click', closeModal);
  modalOverlay.addEventListener('click', (e) => {
    if (e.target === modalOverlay) closeModal();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !modalOverlay.hidden) closeModal();
  });

  loadTrips();
</script>

</body>
</html>
